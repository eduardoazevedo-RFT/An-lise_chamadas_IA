version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ipforce-db
    environment:
      POSTGRES_USER: ipforce
      POSTGRES_PASSWORD: ipforce_secret
      POSTGRES_DB: ipforce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipforce -d ipforce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ipforce-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipforce-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ipforce:ipforce_secret@db:5432/ipforce
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - whisper_models:/root/.cache/whisper
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipforce-celery
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ipforce:ipforce_secret@db:5432/ipforce
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - whisper_models:/root/.cache/whisper
      - audio_tmp:/tmp/audio
    depends_on:
      - db
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "celery -A app.tasks.celery_app:celery_app worker -l info -Q default,transcricao,analise --concurrency=1"

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipforce-beat
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ipforce:ipforce_secret@db:5432/ipforce
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "celery -A app.tasks.celery_app:celery_app beat -l info"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ipforce-frontend
    ports:
      - "3000:3000"
    environment:
    depends_on:
      - backend

  # Caddy opcional - descomente se quiser HTTPS com dominio no futuro
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: ipforce-caddy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - backend
  #     - frontend

volumes:
  postgres_data:
  redis_data:
  whisper_models:
  audio_tmp:
